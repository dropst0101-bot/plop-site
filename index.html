<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLOP! 다운로드</title>

  <script>
    function redirect() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;

      var ios = "https://apps.apple.com/kr/app/id6759692227";
      var android = "https://play.google.com/store/apps/details?id=kr.co.dropstudio.plop&pcampaignid=web_share";

      if (/android/i.test(ua)) {
        window.location.replace(android);
      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        window.location.replace(ios);
      }
    }

    window.onload = function () {
      redirect();
    };
  </script>

  <style>
    body {
      margin:0;
      background:#111;
      color:#fff;
      font-family:sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
    }
    a {
      display:block;
      margin:10px;
      padding:14px;
      border-radius:10px;
      background:#fff;
      color:#111;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>
  <div>
    <h1>PLOP!</h1>
    <p>자동으로 이동 중입니다...</p>
    <a href="https://apps.apple.com/kr/app/id여기">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=여기">Google Play</a>
  </div>
</body>
</html>
