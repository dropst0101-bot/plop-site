<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLOP! 다운로드</title>

  <script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || window.opera;

    var ios = "https://apps.apple.com/kr/app/id6759692227";
    var android = "https://play.google.com/store/apps/details?id=kr.co.dropstudio.plop&pcampaignid=web_share";

    if (/android/i.test(ua)) {
      window.location.replace(android);
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      window.location.replace(ios);
    } else {
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("desktop-fallback").style.display = "block";
      });
    }
  })();
  </script>

  <style>
    body {
      margin: 0;
      background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url('/download/bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    #desktop-fallback > div {
      max-width: 420px;
      width: 100%;
      padding: 28px;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
    }

    .app-icon {
      width: 100px;
      max-width: 30vw;
      height: auto;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .title {
      font-size: 16px;
      line-height: 1.5;
      margin: 8px 0 16px;
    }

    .brand {
      font-weight: 700;
    }

    .title strong {
      display: block;
      font-size: 20px;
      margin-top: 4px;
    }

    p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 20px;
    }

    a {
      display: block;
      margin: 10px 0;
      padding: 14px;
      border-radius: 12px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <div id="desktop-fallback" style="display:none;">
    <div>
      <img src="/download/logo.png" alt="PLOP 아이콘" class="app-icon">

      <h1 class="title">
        <span class="brand">플롭</span> - 즐거움이 톡 터지는 컬렉팅<br>
        <strong>PLOP!</strong>
      </h1>

      <p>모바일에서 접속하면 앱스토어 또는 플레이스토어로 자동 이동합니다.</p>

      <a href="https://apps.apple.com/kr/app/id6759692227">App Store</a>
      <a href="https://play.google.com/store/apps/details?id=kr.co.dropstudio.plop&pcampaignid=web_share">Google Play</a>
    </div>
  </div>
</body>
</html>
